services:
  telegram-gatekeeper-tribute-capture:
    profiles:
      - tribute-capture
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-gatekeeper-tribute-capture:local
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: "3100"
      TRIBUTE_CAPTURE_ENABLED: "${TRIBUTE_CAPTURE_ENABLED:-false}"
      TRIBUTE_CAPTURE_HMAC_KEY: "${TRIBUTE_CAPTURE_HMAC_KEY:-}"
    volumes:
      - tribute-capture-receipts:/data
    labels:
      - "traefik.enable=${TRIBUTE_CAPTURE_ENABLED:-false}"
      - "traefik.docker.network=root_default"
      - "traefik.http.routers.telegram-gatekeeper-tribute-capture.rule=Host(`news.questtales.com`) && Path(`/webhooks/tribute`)"
      - "traefik.http.routers.telegram-gatekeeper-tribute-capture.priority=1000"
      - "traefik.http.routers.telegram-gatekeeper-tribute-capture.entrypoints=web,websecure"
      - "traefik.http.routers.telegram-gatekeeper-tribute-capture.tls=true"
      - "traefik.http.routers.telegram-gatekeeper-tribute-capture.tls.certresolver=mytlschallenge"
      - "traefik.http.services.telegram-gatekeeper-tribute-capture.loadbalancer.server.port=3100"
    networks:
      - root_default

volumes:
  tribute-capture-receipts:

networks:
  root_default:
    external: true
    name: root_default
